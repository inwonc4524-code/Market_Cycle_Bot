name: 텔레그램 시험 알림

# 이 파일이 바뀌거나, Actions 에서 Run workflow 를 누르면 텔레그램으로 시험 메시지를 보내고
# 안 되면 이유를 화면에 보여줘요. (새 봇은 텔레그램에서 먼저 시작을 눌러야 해요)
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/telegram-test.yml
      - telegram_test.py

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 텔레그램 시험
        env:
          BOT_NAME: "사이클(이어달리기) 봇"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_test.py
